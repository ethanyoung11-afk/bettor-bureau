name: Audit live +EV coverage

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Bettor Bureau
        run: pip install .
      - name: Audit every current sportsbook price
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m odds_scanner.ev_audit
